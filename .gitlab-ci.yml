# Chaîne d'intégration — trois barrières.
#
# Chaque tâche ne fait que rendre obligatoire une commande qui existe déjà et
# se rejoue à l'identique à la main. Rien n'a été inventé pour la chaîne :
# c'est ce qui la rend tenable. Le détail est dans ci/README.md.

stages:
  - verifier

# Une poussée qui en remplace une autre annule le pipeline devenu inutile.
default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

# Sans cette règle, une branche suivie par une demande de fusion déclenche
# deux pipelines identiques : un de branche, un de fusion.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

# ---------------------------------------------------------------- le socle
#
# PostgreSQL est démarré en embarqué par les tests (zonky) : ni service, ni
# installation. Chaque base de test est montée par SchemaMigrator, le runner de
# production — le chemin de déploiement est donc exercé à chaque pipeline, pas
# seulement le jour du déploiement.
#
# `mvn test` prend `*Test.java` et `*IT.java`. Les mesures (`*Benchmark.java`)
# ne sont pas prises par ce motif, et c'est délibéré : un pipeline qui échoue
# sur un débit — sensible à la machine, au voisinage, au hasard — est un
# pipeline qu'on relance sans lire, puis qu'on désactive.
socle:
  stage: verifier
  image: maven:3.9-eclipse-temurin-21
  timeout: 30m
  cache:
    key:
      files:
        - core-banking/pom.xml
    paths:
      - .m2/repository
  script:
    - cd core-banking
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: core-banking/*/target/surefire-reports/TEST-*.xml

# --------------------------------------------------------------- le front
#
# Trois garde-fous deviennent ici des barrières :
#   — `ng test` joue la suite (zoneless, vitest) et rend la main ;
#   — `ng build` échoue au-delà du budget de taille déclaré dans angular.json ;
#   — `check:largeurs` ouvre chaque écran à sept largeurs et refuse un
#     débordement horizontal ou une cible sous 24 px (WCAG 2.2, 2.5.8).
#
# `npm run servir` sert la compilation avec repli SPA : sans lui, les routes
# profondes répondent 404 et le contrôle mesurerait des pages d'erreur en
# annonçant des écrans conformes.
front:
  stage: verifier
  image: node:24
  timeout: 20m
  cache:
    key:
      files:
        - core-banking/web/package-lock.json
    paths:
      - core-banking/web/node_modules
  script:
    - cd core-banking/web
    - npm ci
    - npm test -- --reporters=default --reporters=junit --output-file=rapport-junit.xml
    - npm run build
    # Le navigateur vient de la version de Playwright verrouillée par
    # package-lock.json, pas d'une version choisie ici : deux sources pour une
    # même dépendance finissent par diverger.
    - npx playwright install --with-deps chromium
    - npm run servir &
    - for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8181/ && break; sleep 1; done
    - npm run check:largeurs -- http://127.0.0.1:8181/
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: core-banking/web/rapport-junit.xml

# -------------------------------------------------------- la documentation
#
# Un lien cassé ne se voit pas à la relecture : il se voit le jour où
# quelqu'un le suit. Portée : tout le dépôt.
documentation:
  stage: verifier
  image: python:3.12-slim
  timeout: 5m
  script:
    - python3 docs/outils/liens.py
