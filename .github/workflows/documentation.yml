# ---------------------------------------------------------------------------
#  Barriere temporaire, le temps que le depot reste sur GitHub.
#
#  L'automatisation retenue est GitLab (.gitlab-ci.yml, documente dans ci/).
#  Ce fichier existe parce qu'une barriere qui ne tourne nulle part n'est pas
#  une barriere, et que la periode de stabilisation est justement celle ou les
#  tests doivent etre obligatoires.
#
#  Il ne redefinit rien : il joue les memes commandes que .gitlab-ci.yml, celles
#  que ci/README.md recense et qu'on rejoue a la main a l'identique. Deux
#  definitions des memes barrieres finiraient par diverger ; c'est pourquoi
#  celle-ci reste minimale et disparait a la migration.
# ---------------------------------------------------------------------------
# Les liens internes de la documentation.
#
# Un lien cassé ne se voit pas à la relecture : il se voit le jour où quelqu'un
# le suit. Ce contrôle les attrape au moment où on les casse — en déplaçant ou
# en renommant un fichier, ce qui arrive à chaque réorganisation.
#
# Portée : tout le dépôt.
name: Documentation

on:
  push:
    paths: ['*.md', 'docs/**', 'core-banking/**/*.md', 'ci/**', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['*.md', 'docs/**', 'core-banking/**/*.md', 'ci/**', '.github/workflows/documentation.yml']
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  liens:
    name: Liens internes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fichiers et ancres cités
        run: python3 docs/outils/liens.py
